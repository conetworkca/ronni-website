<!--
  CLIENT RESULTS — testimonial slider
  Paste this whole block into a GHL "Custom Code" element.

  Matches the live site (ronnidraft.conetwork.ca):
  - Desktop (768px+): 3 cards in a grid that fade up one after another as they scroll into view.
  - Mobile (under 768px): a swipeable slider (scroll-snap, one card centred at a time) with "Swipe for more →".
  - Cards lift with a soft shadow on hover.

  This block holds testimonial set 1 from the home page. Sets 2 and 3 are at the bottom
  of this file, ready to swap in. For a 2-card set, add the class "rl-cr--two" to the
  <section> (gives the narrower, centred 2-column grid the live site uses).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">

<style>
  .rl-cr {
    --rl-wine: #682830;
    --rl-linen: #EBEAE8;
    --rl-ink: #2F2325;
    --rl-muted-brown: #6E5850;
    --rl-taupe: #A48C82;
    --rl-light-line: #D9D2CE;
    --rl-card: #FFFFFF;
    background: var(--rl-linen);
    color: var(--rl-ink);
    font-family: "Jost", ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .rl-cr *, .rl-cr *::before, .rl-cr *::after { box-sizing: border-box; }

  .rl-cr__inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 24px;
  }

  .rl-cr__eyebrow {
    display: inline-block;
    font-family: "Jost", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--rl-muted-brown);
  }

  /* Mobile: swipe slider */
  .rl-cr__track {
    display: flex;
    gap: 16px;
    margin: 32px -24px 0;
    padding: 0 24px 16px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .rl-cr__track::-webkit-scrollbar { display: none; }

  .rl-cr__item {
    flex-shrink: 0;
    width: 85vw;
    max-width: 340px;
    scroll-snap-align: center;
  }

  .rl-cr__hint {
    margin: 12px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--rl-muted-brown);
  }

  /* Card */
  .rl-cr__card {
    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0;
    padding: 32px;
    background: var(--rl-card);
    border: 1px solid var(--rl-light-line);
    border-radius: 24px;
    transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .rl-cr__card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 44px -20px rgba(47, 35, 37, 0.28);
  }
  .rl-cr__mark {
    font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
    font-size: 64px;
    font-weight: 500;
    line-height: 1;
    color: var(--rl-taupe);
  }
  .rl-cr__quote {
    margin: -16px 0 0;
    padding: 0;
    border: 0;
    font-size: 18px;
    line-height: 1.625;
    color: var(--rl-ink);
  }
  .rl-cr__meta {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--rl-light-line);
  }
  .rl-cr__name {
    font-family: "Jost", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--rl-wine);
  }
  .rl-cr__role {
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--rl-muted-brown);
  }

  @media (min-width: 640px) {
    .rl-cr__inner { padding-left: 32px; padding-right: 32px; }
  }

  /* Desktop: grid */
  @media (min-width: 768px) {
    .rl-cr__track {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 32px;
      margin: 40px 0 0;
      padding: 0;
      overflow: visible;
    }
    .rl-cr--two .rl-cr__track {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 896px;
      margin-left: auto;
      margin-right: auto;
    }
    .rl-cr__item { width: auto; max-width: none; }
    .rl-cr__hint { display: none; }
  }

  @media (min-width: 1024px) {
    .rl-cr__inner { padding-top: 96px; padding-bottom: 96px; }
  }

  /* Scroll reveal: fade up 28px over 700ms. Label at every size; cards on desktop only, like the live site. */
  .rl-cr--ready .rl-cr__reveal {
    transition: opacity 700ms cubic-bezier(0, 0, 0.2, 1), transform 700ms cubic-bezier(0, 0, 0.2, 1);
    will-change: transform;
  }
  .rl-cr--ready .rl-cr__reveal:not(.is-visible) {
    opacity: 0;
    transform: translateY(28px);
  }
  @media (max-width: 767.98px) {
    .rl-cr--ready .rl-cr__item.rl-cr__reveal:not(.is-visible) { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rl-cr--ready .rl-cr__reveal:not(.is-visible) { opacity: 1; transform: none; }
  }
</style>

<section class="rl-cr" aria-label="Client results">
  <div class="rl-cr__inner">
    <div class="rl-cr__reveal">
      <span class="rl-cr__eyebrow">CLIENT RESULTS</span>
    </div>

    <div class="rl-cr__track">
      <div class="rl-cr__item rl-cr__reveal">
        <figure class="rl-cr__card">
          <span class="rl-cr__mark" aria-hidden="true">“</span>
          <blockquote class="rl-cr__quote">I came to Ronni completely burned out. Six months later, I lead my team with energy I forgot I had.</blockquote>
          <div class="rl-cr__meta">
            <figcaption class="rl-cr__name">Sarah Mitchell</figcaption>
            <p class="rl-cr__role">Director of Operations</p>
          </div>
        </figure>
      </div>

      <div class="rl-cr__item rl-cr__reveal">
        <figure class="rl-cr__card">
          <span class="rl-cr__mark" aria-hidden="true">“</span>
          <blockquote class="rl-cr__quote">The Energy Leadership Index opened my eyes. I finally saw why stress kept running my decisions.</blockquote>
          <div class="rl-cr__meta">
            <figcaption class="rl-cr__name">David Chen</figcaption>
            <p class="rl-cr__role">Senior Project Manager</p>
          </div>
        </figure>
      </div>

      <div class="rl-cr__item rl-cr__reveal">
        <figure class="rl-cr__card">
          <span class="rl-cr__mark" aria-hidden="true">“</span>
          <blockquote class="rl-cr__quote">I got the promotion and still felt empty. Ronni helped me find what actually fulfills me.</blockquote>
          <div class="rl-cr__meta">
            <figcaption class="rl-cr__name">Melissa Grant</figcaption>
            <p class="rl-cr__role">VP of Marketing</p>
          </div>
        </figure>
      </div>
    </div>

    <p class="rl-cr__hint">Swipe for more →</p>
  </div>
</section>

<script>
  (function () {
    // Runs for every Client Results block on the page, so the snippet can be pasted more than once.
    var sections = document.querySelectorAll('.rl-cr:not(.rl-cr--ready)');
    if (!sections.length) return;

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !('IntersectionObserver' in window)) return; // content simply shows, no animation

    sections.forEach(function (section) {
      // Stagger the cards 0 / 90 / 180ms, as on the live site
      section.querySelectorAll('.rl-cr__item').forEach(function (item, i) {
        item.style.transitionDelay = (i * 90) + 'ms';
      });

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

      section.querySelectorAll('.rl-cr__reveal').forEach(function (el) { observer.observe(el); });
      section.classList.add('rl-cr--ready');
    });
  })();
</script>
